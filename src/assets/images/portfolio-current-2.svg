<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2A44" />
      <stop offset="50%" stop-color="#3D4D7C" />
      <stop offset="100%" stop-color="#2B3859" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B7C3DA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7D90B5" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#B7C3DA" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Architectural Blueprint Grid Pattern -->
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Diagonal Accent Flare -->
  <circle cx="700" cy="50" r="300" fill="#7D90B5" opacity="0.12" filter="blur(60px)" />
  <circle cx="100" cy="400" r="220" fill="#3D4D7C" opacity="0.2" filter="blur(50px)" />

  <!-- Geometric Drafting Triangle Overlay -->
  <path d="M50 400 L250 80 L450 400 Z" fill="none" stroke="#B7C3DA" stroke-width="1.5" stroke-opacity="0.18" />
  <line x1="250" y1="80" x2="250" y2="400" stroke="#B7C3DA" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.25" />

  <!-- Center Card Glass Frame -->
  <rect x="80" y="75" width="640" height="300" rx="20" fill="#1F2A44" fill-opacity="0.45" stroke="#B7C3DA" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Watermark Tag -->
  <text x="120" y="125" font-family="'Oswald', sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#B7C3DA">
    WILLIAMS &amp; WILLIAMS LLC &bull; CHICAGO ZONING
  </text>

  <!-- Icon Circle -->
  <g transform="translate(120, 160)">
    <circle cx="36" cy="36" r="36" fill="#3D4D7C" fill-opacity="0.6" stroke="#B7C3DA" stroke-width="1.5" />
    <g transform="translate(20, 20) scale(1.3)" stroke="#FFFFFF" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18M3 7v14M21 7v14M6 7V3h12v4M9 11h2v2H9v-2zm6 0h2v2h-2v-2zm-6 4h2v2H9v-2zm6 0h2v2h-2v-2z" />
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="220" y="195" font-family="'Oswald', sans-serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">
    FULTON MARKET MIXED-USE
  </text>
  <text x="220" y="225" font-family="'Montserrat', sans-serif" font-size="15" font-weight="400" fill="#DDE2EA">
    DX-5 Planned Development Approval | Retail & 24 Boutique Units
  </text>

  <!-- Status / Badge -->
  <rect x="220" y="255" width="180" height="30" rx="15" fill="#3D4D7C" fill-opacity="0.8" stroke="#B7C3DA" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="236" cy="270" r="4" fill="#3FA66B" />
  <text x="248" y="275" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#FFFFFF">
    VERIFIED CHICAGO ZONING
  </text>

  <!-- Bottom Stamp Line -->
  <line x1="80" y1="374" x2="720" y2="374" stroke="url(#glow)" stroke-width="2" />
</svg>